%YAML 1.2
---
$id: http://devicetree.org/schemas/net/brcm,bcm63268-xtm-dma.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: BCM63268 family XTM DMA offline resource contract

maintainers:
  - gianguyen14 <231934554+gianguyen14@users.noreply.github.com>

description: |
  Experimental local contract for RX0 and TX hardware channel 4. This is not
  an upstream binding or an active board configuration. Resources are derived
  from exact-family register definitions. A parent must establish exclusive
  SAR/PHY/FAP ownership and verified clock/reset sequencing before attachment.
  The required disabled status prevents this fixture from enabling hardware.

properties:
  compatible:
    const: brcm,bcm63268-xtm-dma
  reg:
    maxItems: 5
  reg-names:
    items:
      - const: global
      - const: rx-channel
      - const: rx-state
      - const: tx-channel
      - const: tx-state
  interrupts:
    maxItems: 2
  interrupt-names:
    items:
      - const: rx
      - const: tx
  clocks:
    maxItems: 1
  clock-names:
    const: sar
  resets:
    maxItems: 1
  reset-names:
    const: sar
  power-domains:
    maxItems: 1
  status:
    const: disabled

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - clocks
  - clock-names
  - resets
  - reset-names
  - power-domains
  - status

additionalProperties: false
